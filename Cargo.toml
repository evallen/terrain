[package]
name = "terrain"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
path = "src/wasm/lib.rs"

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "ImageData",
    "Element",
    "console",
] }
console_error_panic_hook = "0.1.7"
noise = "0.9.0"
num = "0.4.3"
bytemuck = { version = "1.25.0", features = ["derive"] }
color-hex = "0.2.0"

[profile.release]
opt-level = "z"
lto = true
